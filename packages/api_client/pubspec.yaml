name: api_client
description: Client to access Formula One public APIs.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  clock: ^1.1.3
  dio: ^5.11.1
  equatable: ^3.0.0
  json_annotation: ^4.12.0
  response_cache:
    path: ../response_cache

dev_dependencies:
  build_runner: ^2.16.2
  coverage: ^1.16.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  test: ^1.32.0
  very_good_analysis: ^11.0.0
