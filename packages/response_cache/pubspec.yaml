name: response_cache
description: Serves JSON API responses from a Storage and goes to network only on a miss.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  clock: ^1.1.3
  equatable: ^3.0.0
  storage:
    path: ../storage/storage

dev_dependencies:
  mocktail: ^1.0.5
  test: ^1.32.0
  very_good_analysis: ^11.0.0
